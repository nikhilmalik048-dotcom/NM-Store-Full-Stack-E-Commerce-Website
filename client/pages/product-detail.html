<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - NM Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div class="container section" id="product-detail-root">
    <div class="spinner"></div>
  </div>

  <div class="container section" style="background:white; border-radius:var(--radius);">
    <h2 class="mb-2">Customer Reviews</h2>
    <div id="review-form-container" class="mb-3"></div>
    <div id="reviews-list"><div class="spinner"></div></div>
  </div>

  <div class="container section">
    <div class="section-title"><h2>Related Products</h2></div>
    <div id="related-products" class="product-grid"></div>
  </div>

  <div id="footer-root"></div>

  <script src="/js/main.js"></script>
  <script src="/js/product-card.js"></script>
  <script src="/js/product-detail.js"></script>
</body>
</html>
