<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - NM Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="#dashboard" data-tab="dashboard" class="admin-nav-link active">📊 Dashboard</a>
      <a href="#products" data-tab="products" class="admin-nav-link">📦 Products</a>
      <a href="#orders" data-tab="orders" class="admin-nav-link">🧾 Orders</a>
      <a href="#categories" data-tab="categories" class="admin-nav-link">🗂️ Categories</a>
      <a href="#brands" data-tab="brands" class="admin-nav-link">🏷️ Brands</a>
      <a href="#coupons" data-tab="coupons" class="admin-nav-link">🎟️ Coupons</a>
      <a href="#users" data-tab="users" class="admin-nav-link">👥 Users</a>
    </aside>
    <main class="admin-content" id="admin-content">
      <div class="spinner"></div>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/admin-products.js"></script>
  <script src="/js/admin-orders.js"></script>
  <script src="/js/admin-catalog.js"></script>
  <script src="/js/admin-coupons.js"></script>
  <script src="/js/admin-users.js"></script>
  <script src="/js/admin.js"></script>

</html>
