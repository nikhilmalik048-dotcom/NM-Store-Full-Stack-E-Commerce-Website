<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="View and manage your NM Store orders."
  />

  <title>My Orders - NM Store</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  />
</head>

<body>

  <!-- ==============================
       NAVBAR
  =============================== -->

  <div id="navbar-root"></div>


  <!-- ==============================
       ORDERS PAGE
  =============================== -->

  <main class="orders-page">

    <div class="container section">

      <!-- Page Header -->

      <div class="orders-header">

        <div>

          <span class="section-badge">
            📦 MY SHOPPING
          </span>

          <h1>
            My Orders
          </h1>

          <p>
            Track your purchases and view your
            order details in one place.
          </p>

        </div>

        <a
          href="/products"
          class="btn btn-primary"
        >
          Continue Shopping →
        </a>

      </div>


      <!-- Orders -->

      <div
        id="orders-root"
        class="orders-container"
      >
        <div class="spinner"></div>
      </div>

    </div>


    <!-- ==============================
         ORDER DETAIL
    =============================== -->

    <section
      class="container section order-detail-wrapper"
      id="order-detail-section"
      style="display:none;"
    >

      <div class="order-detail-header">

        <button
          class="btn btn-outline btn-sm"
          id="back-to-orders"
          type="button"
        >
          ← Back to Orders
        </button>

      </div>

      <div id="order-detail-root"></div>

    </section>

  </main>


  <!-- ==============================
       FOOTER
  =============================== -->

  <div id="footer-root"></div>


  <!-- ==============================
       SCRIPTS
  =============================== -->

  <script src="/js/main.js"></script>
  <script src="/js/orders.js"></script>

</body>
</html>
