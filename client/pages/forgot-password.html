<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - NM Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-wrapper">
    <div class="card">
      <h2>Forgot your password?</h2>
      <p class="sub">Enter your email and we'll generate a reset token for you.</p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Get Reset Token</button>
      </form>

      <div id="reset-token-box" class="card mt-3" style="display:none; background:#f0f9ff;">
        <strong style="font-size:13px;">Your reset token:</strong>
        <p id="reset-token-value" style="word-break:break-all; font-family:monospace; font-size:12.5px; margin:8px 0;"></p>
        <a class="btn btn-secondary btn-sm" id="go-reset-link" href="#">Reset Password Now</a>
        <p style="font-size:12px; color:var(--text-light); margin-top:8px;">
          Note: In a production app this token would be emailed to you. This demo shows it directly since no email service is configured.
        </p>
      </div>

      <div class="auth-switch">Remembered your password? <a href="/login">Login here</a></div>
    </div>
  </div>

  <div id="footer-root"></div>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      try {
        const data = await apiRequest('/auth/forgot-password', { method: 'POST', body: { email } });
        document.getElementById('reset-token-value').textContent = data.resetToken;
        document.getElementById('go-reset-link').href = `/reset-password.html?token=${data.resetToken}`;
        document.getElementById('reset-token-box').style.display = 'block';
        showToast('Reset token generated', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
