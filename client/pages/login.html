<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - NM Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-wrapper">
    <div class="card">
      <h2>Welcome back</h2>
      <p class="sub">Log in to continue shopping</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••" />
        </div>
        <div class="flex-between mb-2" style="font-size:13.5px;">
          <label style="display:flex; align-items:center; gap:6px; font-weight:400;">
            <a href="/forgot-password" id="forgot-link">Forgot password?</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>

      <div class="auth-switch">Don't have an account? <a href="/register">Register here</a></div>

      <div class="card mt-3" style="background:#f0f9ff; padding:14px;">
        <strong style="font-size:13px;">Demo Admin Login</strong>
        <p style="font-size:12.5px; color:var(--text-light); margin-top:4px;">
          After running <code>npm run seed</code>, use the admin email/password from your .env file to access the admin panel.
        </p>
      </div>
    </div>
  </div>

  <div id="footer-root"></div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await apiRequest('/auth/login', { method: 'POST', body: { email, password } });
        Auth.setSession(data.token, data.user);
        showToast('Login successful', 'success');
        setTimeout(() => {
          window.location.href = data.user.role === 'admin' ? '/admin' : '/';
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
