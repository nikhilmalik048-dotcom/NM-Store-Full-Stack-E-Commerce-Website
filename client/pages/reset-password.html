<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - NM Store</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div class="auth-wrapper">
    <div class="card">
      <h2>Reset your password</h2>
      <p class="sub">Enter the reset token and your new password.</p>

      <form id="reset-form">
        <div class="form-group">
          <label for="token">Reset token</label>
          <input type="text" id="token" required placeholder="Paste your reset token" />
        </div>
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
    </div>
  </div>

  <div id="footer-root"></div>
  <script src="/js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const prefillToken = params.get('token');
    if (prefillToken) document.getElementById('token').value = prefillToken;

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('token').value.trim();
      const password = document.getElementById('password').value;
      try {
        const data = await apiRequest(`/auth/reset-password/${token}`, { method: 'PUT', body: { password } });
        Auth.setSession(data.token, data.user);
        showToast('Password reset successful', 'success');
        setTimeout(() => (window.location.href = '/'), 700);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
